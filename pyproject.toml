[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wos-merge"
version = "0.1.0"
description = "Parse Web of Science (WoS) export files and merge them into a single de-duplicated CSV."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Saura" }]
keywords = ["web of science", "wos", "bibliometrics", "research", "pandas", "csv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/your-username/wos-merge"
Issues = "https://github.com/your-username/wos-merge/issues"

[project.scripts]
wos-merge = "wos_merge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
